name: Build and Publish MAUI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui-android

      - name: Generate UTC Version Metadata
        id: versioning
        shell: bash
        run: |
          utc_date=$(date -u +"%Y.%m.%d")
          
          display_version="${utc_date}.${{ github.run_number }}"
          
          padded_run=$(printf "%03d" "${{ github.run_number }}")
          version_code="$(date -u +"%y%m%d")${padded_run}"

          echo "DISPLAY_VERSION=$display_version" >> $GITHUB_ENV
          echo "VERSION_CODE=$version_code" >> $GITHUB_ENV

      - name: Publish .NET MAUI Android APK
        run: |
          dotnet publish "WarrantyTracker/WarrantyTracker.csproj" \
            -f net10.0-android \
            -c Release \
            -p:ApplicationDisplayVersion=${{ env.DISPLAY_VERSION }} \
            -p:ApplicationVersion=${{ env.VERSION_CODE }} \
            -p:AndroidKeyStore=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warranty-tracker-beta-${{ env.DISPLAY_VERSION }}
          path: WarrantyTracker/bin/Release/net10.0-android/*-Signed.apk