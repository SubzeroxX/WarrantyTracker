name: Build and Publish MAUI Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4

      - name: Install .NET MAUI Workload
        run: dotnet workload install maui

      - name: Generate UTC Version Metadata
        id: versioning
        shell: pwsh
        run: |
          $utcNow = [DateTime]::UtcNow
          $displayVersion = $utcNow.ToString("yyyy.MM.dd.HHmm")
          $versionCode = $utcNow.ToString("yyMMddHHmm")

          Write-Host "Display Version: $displayVersion"
          Write-Host "Version Code: $versionCode"

          echo "DISPLAY_VERSION=$displayVersion" >> $env:GITHUB_ENV
          echo "VERSION_CODE=$versionCode" >> $env:GITHUB_ENV

      - name: Publish .NET MAUI Android APK
        run: |
          dotnet publish "YourAppFolder/YourApp.csproj" `
            -f net10.0-android `
            -c Release `
            -p:ApplicationDisplayVersion=${{ env.DISPLAY_VERSION }} `
            -p:ApplicationVersion=${{ env.VERSION_CODE }} `
            -p:AndroidKeyStore=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: warranty-tracker-beta-${{ env.DISPLAY_VERSION }}
          path: YourAppFolder/bin/Release/net10.0-android/*-Signed.apk